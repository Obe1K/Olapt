name: UI tests and screenshots

# Запускается только вручную: вкладка Actions → «UI tests and screenshots» → Run workflow.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Запустить только этот тест (например testZ_StoreScreenshots); пусто — все"
        required: false
        default: ""

jobs:
  ui:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "Xcode 26 не найден"
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Собрать приложение
        run: |
          set -o pipefail
          xcodebuild build \
            -project OlaPT.xcodeproj \
            -scheme OlaPT \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -n 40

      - name: Подготовить симулятор и установить приложение
        run: |
          UDID=$(python3 UITests/pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # аккуратная строка состояния для скриншотов App Store: 9:41, полный заряд
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          APP=$(find build/Build/Products -maxdepth 2 -name "OlaPT.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl listapps "$UDID" | grep -i olapt || true

      - name: Создать проект тестов (XcodeGen)
        run: |
          brew install xcodegen
          cd UITests
          xcodegen generate

      - name: Запустить автотесты
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          FILTER=""
          if [ -n "$ONLY" ]; then FILTER="-only-testing:OlaPTUITests/ScreenshotTests/$ONLY"; fi
          xcodebuild test \
            -project UITests/OlaPTUITests.xcodeproj \
            -scheme OlaPTUITests \
            -destination "id=$UDID" \
            $FILTER \
            -derivedDataPath uibuild \
            -resultBundlePath result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee uitests.log

      - name: Проверки (аннотации)
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              log = open("uitests.log", encoding="utf-8", errors="replace").read()
          except OSError:
              log = ""
          def enc(lines):
              return "%0A".join(l.replace("%", "%25") for l in lines)
          checks = []
          for m in re.finditer(r"STEP (CHECK[^\n]*)", log):
              if m.group(1) not in checks:
                  checks.append(m.group(1))
          checks = checks[:60]
          if checks:
              print("::notice title=UI checks::" + enc(checks))
              fails = [c for c in checks if "FAILED" in c]
              if fails:
                  print("::error title=UI checks failed::" + enc(fails))
          else:
              print("::warning title=UI checks::no CHECK lines in log")
          errors = []
          for m in re.finditer(r"error: ([^\n]*)", log):
              e = m.group(1).strip()
              if e not in errors:
                  errors.append(e)
          if errors:
              print("::error title=Test errors::" + enc(errors[:15]))
          tests = re.findall(r"Test Case '-\[\S+ (\w+)\]' (passed|failed)", log)
          if tests:
              print("::notice title=UI tests::" + enc(sorted(set(n + " " + r for n, r in tests))))
          PY

      - name: Достать скриншоты
        if: always()
        run: |
          xcrun xcresulttool export attachments --path result.xcresult --output-path shots || true
          python3 UITests/rename_shots.py shots shots_named || true
          ls shots_named | head -80 || true

      - name: Скриншоты в ветку ui-shots (для просмотра без скачивания архива)
        if: always()
        run: |
          set +e
          [ -d shots_named ] || exit 0
          TMP=$(mktemp -d)
          cp shots_named/*.png "$TMP"/ 2>/dev/null
          ls "$TMP"/*.png >/dev/null 2>&1 || exit 0
          sips -Z 900 "$TMP"/*.png >/dev/null 2>&1
          git config user.name "ui-tests"
          git config user.email "ui-tests@users.noreply.github.com"
          git checkout -q --orphan ui-shots-tmp
          git rm -rq --cached . >/dev/null 2>&1
          mkdir -p shots_out && cp "$TMP"/*.png shots_out/
          git add shots_out
          git commit -qm "UI screenshots, run $GITHUB_RUN_NUMBER ($GITHUB_REF_NAME)"
          git push -qf origin HEAD:refs/heads/ui-shots && echo "::notice title=Screenshots::pushed to branch ui-shots"

      - name: Скриншоты для App Store в ветку store-shots (полный размер)
        if: always()
        run: |
          set +e
          ls shots_named/store_*.png >/dev/null 2>&1 || exit 0
          TMP=$(mktemp -d)
          cp shots_named/store_*.png "$TMP"/
          git checkout -q --orphan store-shots-tmp
          git rm -rq --cached . >/dev/null 2>&1
          rm -rf store_shots && mkdir -p store_shots && cp "$TMP"/*.png store_shots/
          sips -g pixelWidth -g pixelHeight store_shots/*.png | grep pixel | sort | uniq -c
          git add store_shots
          git commit -qm "App Store screenshots, run $GITHUB_RUN_NUMBER ($GITHUB_REF_NAME)"
          git push -qf origin HEAD:refs/heads/store-shots && echo "::notice title=Store screenshots::pushed to branch store-shots"

      - name: Сводка
        if: always()
        run: |
          {
            echo "### Результат автотестов"
            echo '```'
            grep -E "Test Case .* (passed|failed)|error:|STEP .*FAILED" uitests.log | sort -u | head -80 || true
            echo '```'
            echo "Скриншотов: $(ls shots_named 2>/dev/null | grep -c png || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: |
            shots_named
            uitests.log
          if-no-files-found: ignore
